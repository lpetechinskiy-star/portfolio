<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Больно ли лечить зубы?","acceptedAnswer":{"@type":"Answer","text":"Лечение идёт под анестезией: сначала обезболиваем место укола гелем, потом ставим анестетик. Если почувствуете дискомфорт — скажите врачу, приём остановят и добавят обезболивание."}},{"@type":"Question","name":"Сколько длится первый приём?","acceptedAnswer":{"@type":"Answer","text":"Обычно около часа: осмотр, снимок, обсуждение плана лечения и стоимости. Если нужно снять острую боль, помогаем в этот же визит."}},{"@type":"Question","name":"Можно ли прийти только на консультацию?","acceptedAnswer":{"@type":"Answer","text":"Да. Вы получите осмотр, снимок и план лечения с ценой — и решите, что делать дальше. Начинать лечение в тот же день не обязательно."}},{"@type":"Question","name":"Делаете ли вы снимок на первом приёме?","acceptedAnswer":{"@type":"Answer","text":"Да, диагностика входит в первичный приём: прицельный снимок или панорамный, а перед имплантацией — объёмный 3D."}},{"@type":"Question","name":"Как подготовиться к приёму?","acceptedAnswer":{"@type":"Answer","text":"Достаточно почистить зубы и взять документы. Если принимаете лекарства, есть аллергия или хронические заболевания — скажите об этом врачу до начала лечения."}},{"@type":"Question","name":"Есть ли лечение для детей?","acceptedAnswer":{"@type":"Answer","text":"Да, детский приём ведёт отдельный врач. Первый визит — знакомство без лечения, чтобы ребёнок спокойно отнёсся к креслу."}},{"@type":"Question","name":"Можно ли узнать стоимость до лечения?","acceptedAnswer":{"@type":"Answer","text":"Да. После осмотра вы получаете план с перечнем работ и ценой каждой позиции. Стоимость не меняется по ходу лечения без вашего согласия."}}]}</script>

41\u0438\u0442\u044C \u0441\u0432\u0435\u0434\u0435\u043D\u0438\u044F \u043E\u0431 \u043E\u0431\u0440\u0430\u0431\u043E\u0442\u043A\u0435 \u0441\u0432\u043E\u0438\u0445 \u0434\u0430\u043D\u043D\u044B\u0445, \u043F\u043E\u0442\u0440\u0435\u0431\u043E\u0432\u0430\u0442\u044C \u0438\u0445 \u0438\u0441\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u044F \u0438\u043B\u0438 \u0443\u0434\u0430\u043B\u0435\u043D\u0438\u044F, \u0430 \u0442\u0430\u043A\u0436\u0435 \u043E\u0442\u043E\u0437\u0432\u0430\u0442\u044C \u0441\u043E\u0433\u043B\u0430\u0441\u0438\u0435. \u0414\u043B\u044F \u044D\u0442\u043E\u0433\u043E \u0434\u043E\u0441\u0442\u0430\u0442\u043E\u0447\u043D\u043E \u043F\u043E\u0437\u0432\u043E\u043D\u0438\u0442\u044C \u0432 \u043A\u043B\u0438\u043D\u0438\u043A\u0443 \u0438\u043B\u0438 \u043D\u0430\u043F\u0438\u0441\u0430\u0442\u044C \u043D\u0430 \u043F\u043E\u0447\u0442\u0443, \u0443\u043A\u0430\u0437\u0430\u043D\u043D\u0443\u044E \u0432 \u043F\u0435\u0440\u0432\u043E\u043C \u0440\u0430\u0437\u0434\u0435\u043B\u0435. \u041A\u043B\u0438\u043D\u0438\u043A\u0430 \u043E\u0442\u0432\u0435\u0447\u0430\u0435\u0442 \u0432 \u0441\u0440\u043E\u043A, \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u043D\u044B\u0439 \u0437\u0430\u043A\u043E\u043D\u043E\u043C."]},{heading:"9. \u0424\u0430\u0439\u043B\u044B cookie \u0438 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A\u0430",paragraphs:["\u0421\u0430\u0439\u0442 \u043C\u043E\u0436\u0435\u0442 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u0444\u0430\u0439\u043B\u044B cookie \u0438 \u0441\u0438\u0441\u0442\u0435\u043C\u044B \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A\u0438 \u0434\u043B\u044F \u043E\u0446\u0435\u043D\u043A\u0438 \u043F\u043E\u0441\u0435\u0449\u0430\u0435\u043C\u043E\u0441\u0442\u0438. \u042D\u0442\u0438 \u0434\u0430\u043D\u043D\u044B\u0435 \u043E\u0431\u0435\u0437\u043B\u0438\u0447\u0435\u043D\u044B \u0438 \u043D\u0435 \u043F\u043E\u0437\u0432\u043E\u043B\u044F\u044E\u0442 \u043E\u043F\u0440\u0435\u0434\u0435\u043B\u0438\u0442\u044C \u043B\u0438\u0447\u043D\u043E\u0441\u0442\u044C \u043F\u043E\u0441\u0435\u0442\u0438\u0442\u0435\u043B\u044F. \u0417\u0410\u041F\u041E\u041B\u041D\u0418\u0422\u0415: \u043D\u0430\u0437\u043E\u0432\u0438\u0442\u0435 \u0441\u0447\u0451\u0442\u0447\u0438\u043A\u0438, \u0435\u0441\u043B\u0438 \u043E\u043D\u0438 \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u044B."]},{heading:"10. \u0418\u0437\u043C\u0435\u043D\u0435\u043D\u0438\u044F \u043F\u043E\u043B\u0438\u0442\u0438\u043A\u0438",paragraphs:["\u041A\u043B\u0438\u043D\u0438\u043A\u0430 \u043C\u043E\u0436\u0435\u0442 \u043E\u0431\u043D\u043E\u0432\u043B\u044F\u0442\u044C \u043F\u043E\u043B\u0438\u0442\u0438\u043A\u0443. \u0414\u0435\u0439\u0441\u0442\u0432\u0443\u044E\u0449\u0430\u044F \u0440\u0435\u0434\u0430\u043A\u0446\u0438\u044F \u0432\u0441\u0435\u0433\u0434\u0430 \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u0430 \u043D\u0430 \u044D\u0442\u043E\u0439 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0435. \u0414\u0430\u0442\u0430 \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0435\u0433\u043E \u043E\u0431\u043D\u043E\u0432\u043B\u0435\u043D\u0438\u044F: ___."]}]},consent:{id:"consent",title:"\u0421\u043E\u0433\u043B\u0430\u0441\u0438\u0435 \u043D\u0430 \u043E\u0431\u0440\u0430\u0431\u043E\u0442\u043A\u0443 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0445 \u0434\u0430\u043D\u043D\u044B\u0445",lead:"\u0422\u0435\u043A\u0441\u0442 \u0441\u043E\u0433\u043B\u0430\u0441\u0438\u044F, \u043A\u043E\u0442\u043E\u0440\u043E\u0435 \u043F\u043E\u0441\u0435\u0442\u0438\u0442\u0435\u043B\u044C \u0434\u0430\u0451\u0442, \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u044F\u044F \u0444\u043E\u0440\u043C\u0443 \u0437\u0430\u043F\u0438\u0441\u0438 \u043D\u0430 \u043F\u0440\u0438\u0451\u043C.",sections:[{heading:"\u041A\u043E\u043C\u0443 \u0434\u0430\u0451\u0442\u0441\u044F \u0441\u043E\u0433\u043B\u0430\u0441\u0438\u0435",paragraphs:[`\
